name: Android Cloud Build

on:
  workflow_dispatch: # This allows you to trigger the build manually

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create local.properties
        working-directory: ./android
        run: echo "HF_TOKEN=hf_dummy_ci_token" > local.properties

      - name: Make Gradle Executable
        working-directory: ./android
        run: chmod +x gradlew

              - name: Fetch MNN-LLM Payload (Cloud Ninja Move)
        working-directory: ./android/app/src/main
        run: |
          echo "Creating payload drop zones..."
          mkdir -p cpp/include
          mkdir -p jniLibs/arm64-v8a
          
          echo "Cloning Alibaba MNN headers..."
          git clone --filter=blob:none --sparse https://github.com/alibaba/MNN.git /tmp/MNN
          cd /tmp/MNN
          git sparse-checkout set include transformers/llm/engine/include
          
          echo "Copying headers to C++ directory..."
          cp -r include/* $GITHUB_WORKSPACE/android/app/src/main/cpp/include/
          cp -r transformers/llm/engine/include/* $GITHUB_WORKSPACE/android/app/src/main/cpp/include/


      - name: Build Android APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LLM-Hub-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
